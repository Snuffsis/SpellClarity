name: Publish SpellClarity to CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish standalone SpellClarity addon
    needs: validate
    if: vars.CURSEFORGE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CURSEFORGE_PUBLISH_ENABLED: ${{ vars.CURSEFORGE_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7.0.0
        with:
          name: spellclarity-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/release
      - name: Check destination, release tag and bundle without credentials
        run: python dev/publish.py
      - name: Upload the exact verified bundle
        run: python dev/publish.py --upload
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Keep confirmed file IDs and any uncertain upload
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curseforge-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/release/curseforge-receipt.json
          if-no-files-found: ignore
          retention-days: 90
